<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 50px;
        }

        .shops-cont {
            display: flex;
            justify-content: center;
            gap: 50px;
            text-align: center;
            margin-bottom: 30px;
        }

        .shop-item img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px auto;
        }

        .shop-item a {
            font-size: 16px;
            color: blue;
            text-decoration: underline;
        }

        hr {
            width: 100%;
            border: 1px solid black;
            margin: 20px 0;
        }

        .footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Online Shop $</h1>
    <div class="shops-cont">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/4d/Lazada_%282019%29.svg?utm_source=th.wikipedia.org&utm_campaign=index&utm_content=original" alt="Lazada">
            <a href="https://pages.lazada.co.th" target="_blank">Lazada</a>
        </div>
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/0e/Shopee_logo.svg" alt="Shopee">
            <a href="https://www.shopee.co.th" target="_blank">Shopee</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        &copy; rchaengp 2026
    </div>
</body>
</html>
